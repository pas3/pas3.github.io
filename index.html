<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>Bashir Electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent || "";
var match = uaFull.match(/PlayStation\s*4[\/\s]+([0-9]+(?:\.[0-9]+)*)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = isPS4 ? parseFloat(fwVersion) : NaN;


window.setStatusMessage = function (message, status) {
    var el = document.getElementById("msgs");
    if (!el) return;
    el.textContent = message;
    el.classList.remove("msg-success", "msg-failure", "msg-progress");
    if (status) el.classList.add("msg-" + status);
};

function showFirmwareVersion() {
    var badge = document.getElementById("fwBadge");
    var value = document.getElementById("fwVersion");
    if (!badge || !value) return;
    value.textContent = isPS4 ? fwVersion : "غير معروف";
    badge.classList.add("show");
}
document.addEventListener("DOMContentLoaded", showFirmwareVersion);

function onScriptError() {
    window.setStatusMessage("تعذر تحميل الملفات المطلوبة. يُرجى مسح بيانات المتصفح وإعادة تحميل التخزين المؤقت ...", "failure");
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        window.setStatusMessage("مخصصة فقط لأجهزة PS4  من 9.00 إلى 14.00", "failure");
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                window.setStatusMessage("إصدار النظام غير مدعوم: " + fwVersion, "failure");
            });
        }
    } else {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
		else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<div id="fwBadge" class="fw-badge" aria-live="polite">إصدار النظام المكتشف: <bdi id="fwVersion" dir="ltr">---</bdi></div>

<hr>
<br>
