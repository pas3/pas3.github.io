<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="css.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Bashir Electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
window.setStatusMessage = function (message, status) {
    var el = document.getElementById("msgs");
    if (!el) return;
    el.textContent = message;
    el.classList.remove("msg-success", "msg-failure", "msg-progress");
    if (status === "success" || status === "failure" || status === "progress") {
        el.classList.add("msg-" + status);
    }
};

function DLProgress(e) {
    var percent = e && e.total ? Math.round((e.loaded / e.total) * 100) : 0;
    // Isolate the LTR percentage so it remains in the correct order in Arabic.
    var percentText = "\u2066" + percent + "%" + "\u2069";
    window.setStatusMessage("جارٍ تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت: " + percentText, "progress");
}

function DisplayCacheProgress() {
    window.setStatusMessage("تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔", "success");
    setTimeout(function () {
        window.setStatusMessage("يرجى قطع الاتصال بالشبكة، وإغلاق المتصفح، ثم إعادة تشغيله ...", "progress");
    }, 1500);
}

(function attachCacheEvents() {
    var appCache = window.applicationCache;
    if (!appCache || typeof appCache.addEventListener !== "function") {
        window.setStatusMessage("متصفح الجهاز لا يتيح واجهة التخزين المؤقت المطلوبة. تحقق من توافق المتصفح أو افتح الصفحة بعد تهيئة التخزين المؤقت.", "failure");
        return;
    }

    appCache.addEventListener("progress", DLProgress, false);
    appCache.addEventListener("cached", DisplayCacheProgress, false);
    appCache.addEventListener("updateready", DisplayCacheProgress, false);
    appCache.addEventListener("error", function () {
        window.setStatusMessage("خطأ في تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت للمتصفح وأعد فتحه ...", "failure");
    }, false);
})();
</script>
<h1> تثبيت التخزين المؤقت</h1>
<hr>
<br>
<h1 id="msgs" class="msg-progress" aria-live="polite">بدء تثبيت ذاكرة التخزين المؤقت...</h1>
